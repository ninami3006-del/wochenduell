<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wochenduell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<title>Wochenduell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Wochen<span>duell</span></div>
    <div class="pill" id="group-pill" hidden></div>
  </header>
  <main>
    <div class="view loading" id="view-loading"><p class="muted" data-i18n="loading">Lädt …</p></div>
    <div class="view" id="view-auth" hidden></div>
    <div class="view" id="view-onboard" hidden></div>
    <div class="view" id="view-heute" hidden></div>
    <div class="view" id="view-rangliste" hidden></div>
    <div class="view" id="view-feed" hidden></div>
    <div class="view" id="view-profil" hidden></div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Navigation" hidden>
  <div class="tabbar-inner">
    <button class="tab" data-tab="heute"><svg class="ico" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg><span data-i18n="tab_heute">Heute</span></button>
    <button class="tab" data-tab="rangliste"><svg class="ico" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7"/></svg><span data-i18n="tab_rangliste">Rangliste</span></button>
    <button class="plus" data-action="open-workout" data-i18n-aria="add_workout" aria-label="Workout eintragen"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="feed"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="tab_feed">Feed</span></button>
    <button class="tab" data-tab="profil"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg><span data-i18n="tab_profil">Profil</span></button>
  </div>
</nav>

<div class="backdrop" id="sheet-workout" data-action="backdrop" hidden>
  <form class="sheet" id="workout-form" role="dialog" aria-modal="true" aria-labelledby="wt">
    <div class="grip"></div>
    <div>
      <h2 id="wt" data-i18n="add_workout">Workout eintragen</h2>
      <p class="hint" style="margin-top:6px" data-i18n="sheet_workout_hint"></p>
    </div>
    <fieldset class="field">
      <legend data-i18n="sport">Sportart</legend>
      <div class="opts" id="sport-opts"></div>
    </fieldset>
    <div class="field">
      <div class="range-head"><label for="dur" data-i18n="duration">Dauer</label><output id="dur-out" for="dur">45</output></div>
      <input type="range" id="dur" min="10" max="150" step="5" value="45">
    </div>
    <div class="preview" id="preview"></div>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" data-action="close-sheet" data-i18n="cancel">Abbrechen</button>
      <button type="submit" class="btn" data-i18n="add">Eintragen</button>
    </div>
  </form>
</div>

<div class="backdrop" id="sheet-values" data-action="backdrop" hidden>
  <form class="sheet" id="values-form" role="dialog" aria-modal="true" aria-labelledby="vt" novalidate>
    <div class="grip"></div>
    <div>
      <h2 id="vt" data-i18n="values_title">Tageswerte</h2>
      <p class="hint" style="margin-top:6px" data-i18n="values_hint"></p>
    </div>
    <div class="field cat-steps">
      <label for="v-steps" data-i18n="v_steps">Schritte</label>
      <div class="unit-row"><input class="input" id="v-steps" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
    </div>
    <div class="field">
      <label for="v-burn" data-i18n="v_burn">Aktive Kalorien</label>
      <div class="unit-row"><input class="input" id="v-burn" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"><span class="muted">kcal</span></div>
    </div>
    <div class="field">
      <label for="v-food" data-i18n="v_food">Gegessene Kalorien</label>
      <div class="unit-row"><input class="input" id="v-food" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"><span class="muted">kcal</span></div>
    </div>
    <p class="form-error" id="values-error" role="alert" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" data-action="close-sheet" data-i18n="cancel">Abbrechen</button>
      <button type="submit" class="btn" data-i18n="save">Speichern</button>
    </div>
  </form>
</div>

<div class="backdrop" id="sheet-rules" data-action="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rt" id="rules-body"></div>
</div>

<div class="backdrop" id="sheet-health" data-action="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ht" id="health-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="install" id="install" hidden>
  <div class="install-inner">
    <p data-i18n-html="install_hint"></p>
    <button class="install-x" id="install-x" data-i18n-aria="close_hint" aria-label="Hinweis schließen">×</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js?v=1"></script>
<script src="i18n.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
